
<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>我的幻灯片</title>
<style>
:root { color-scheme: light; --paper: #fbfaf6; --ink: #22211d; --muted: #716d63; --line: #e3dacb; --accent: #3e7e74; --deck-w: 1280px; --deck-h: 720px; --scale: 1; --ease: cubic-bezier(.22,1,.36,1); font-family: "PingFang SC", "Microsoft YaHei", sans-serif; }
* { box-sizing: border-box; }
body { display: grid; place-items: center; margin: 0; min-height: 100vh; overflow: hidden; padding: 16px; color: var(--ink); background: linear-gradient(90deg, rgba(34,33,29,.032) 1px, transparent 1px) 0 0 / 26px 26px, linear-gradient(rgba(34,33,29,.026) 1px, transparent 1px) 0 0 / 26px 26px, var(--paper); }
.shell { width: calc(var(--deck-w) * var(--scale)); height: calc(var(--deck-h) * var(--scale)); }
.frame { position: relative; width: var(--deck-w); height: var(--deck-h); transform: scale(var(--scale)); transform-origin: center center; display: grid; grid-template-columns: 280px minmax(0,1fr); overflow: hidden; background: var(--paper); border: 1px solid rgba(34,33,29,.12); border-radius: 14px; box-shadow: 0 24px 70px rgba(32,31,27,.12); }
.frame::before { content: ""; position: absolute; inset: 14px; border: 1px solid rgba(34,33,29,.08); border-radius: 8px; pointer-events: none; }
.sidebar { display: flex; flex-direction: column; padding: 48px 28px 32px; background: #f4efe6; border-right: 1px solid var(--line); }
.brand small { font: 12px ui-monospace, monospace; color: var(--muted); }
.brand h1 { font-size: 20px; margin: 10px 0 8px; font-weight: 600; }
.brand p { font-size: 13px; color: var(--muted); line-height: 1.6; margin: 0 0 32px; }
.nav { display: flex; flex-direction: column; gap: 6px; }
.nav button { text-align: left; font: inherit; font-size: 14px; padding: 10px 12px; border: 1px solid transparent; border-radius: 8px; background: transparent; color: var(--muted); cursor: pointer; }
.nav button.active { background: var(--paper); border-color: var(--line); color: var(--ink); }
.footer { margin-top: auto; }
.sign { font-size: 12px; color: var(--muted); margin-bottom: 14px; line-height: 1.6; }
.track { height: 3px; background: var(--line); border-radius: 3px; overflow: hidden; }
.bar { height: 100%; width: 0; background: var(--accent); transition: width 320ms var(--ease); }
.counter { font: 13px ui-monospace, monospace; color: var(--muted); margin-top: 12px; }
.stage { position: relative; overflow: hidden; }
.slide { position: absolute; inset: 0; display: grid; align-content: center; padding: 56px 64px; opacity: 0; pointer-events: none; transform: translateX(18px); transition: opacity 420ms var(--ease), transform 420ms var(--ease); }
.slide.active { opacity: 1; pointer-events: auto; transform: translateX(0); }
.inner { width: min(780px, 100%); }
.kicker { font: 12px ui-monospace, monospace; letter-spacing: .08em; color: var(--accent); text-transform: uppercase; margin: 0 0 14px; }
h2 { font-size: 40px; line-height: 1.3; margin: 0 0 22px; font-weight: 600; }
p.body { font-size: 18px; line-height: 1.85; color: var(--muted); margin: 0 0 12px; white-space: pre-wrap; }
.animate { opacity: 0; transform: translateY(14px); }
.slide.active .animate { animation: rise 620ms var(--ease) forwards; animation-delay: calc(var(--i, 0) * 90ms); }
@keyframes rise { to { opacity: 1; transform: translateY(0); } }
.controls { position: absolute; right: 24px; bottom: 20px; display: flex; gap: 8px; z-index: 5; }
.controls button { font: inherit; font-size: 13px; padding: 6px 14px; border: 1px solid var(--line); border-radius: 8px; background: #fffdf9; cursor: pointer; }
@media (max-width: 980px) {
  body { overflow: auto; }
  .shell { width: 100%; height: auto; }
  .frame { width: 100%; height: auto; min-height: 100vh; transform: none; grid-template-columns: 1fr; border: none; border-radius: 0; box-shadow: none; }
  .sidebar { padding: 24px; }
  .stage { min-height: 70vh; }
  .slide { position: relative; padding: 32px 24px 88px; }
  .slide:not(.active) { display: none; }
  h2 { font-size: 28px; }
  p.body { font-size: 16px; }
}
</style>
</head>
<body>
<div class="shell"><div class="frame" id="frame">
  <aside class="sidebar">
    <div class="brand"><small>My Slides</small><h1 id="brandText"></h1><p id="subText"></p></div>
    <nav class="nav" id="nav"></nav>
    <div class="footer">
      <div class="sign" id="sign"></div>
      <div class="track"><div class="bar" id="bar"></div></div>
      <div class="counter"><span id="cur">01</span> / <span id="total">01</span></div>
    </div>
  </aside>
  <main class="stage" id="stage">
    <div class="controls"><button id="prev">← 上一页</button><button id="next">下一页 →</button></div>
  </main>
</div></div>
<script>
var DATA = {"brand":"我的第一份分享","subtitle":"在左边把文字改成你自己的内容","footer":"版权声明：本内容由我整理，转载请注明来源。","accent":"#3e7e74","slides":[{"nav":"封面","kicker":"2026 / 11 / 16","title":"不用 PPT，也能做一份好看的演示","lines":["这是一个用网页做的幻灯片。","按 → 或空格翻页，左边可以点目录直接跳页。"]},{"nav":"今天聊什么","kicker":"Opening","title":"今天分享三件事","lines":["第一件：这份幻灯片是什么。","第二件：它是怎么做出来的。","第三件：你怎么做出自己的一份。"]},{"nav":"怎么做","kicker":"How to","title":"填字 → 下载 → 打开","lines":["左边每一页改标题和正文，右边会实时变。","点「下载我的幻灯片」得到一个 index.html。","双击打开就能播放，不需要联网、不需要装软件。"]},{"nav":"发到网上","kicker":"Share","title":"想让别人也能看？","lines":["把 index.html 传到 GitHub 仓库，开启 Pages。","一分钟左右就会得到一个公开网址。","具体点哪几个按钮，下面折叠说明里写着。"]},{"nav":"结尾","kicker":"The end","title":"谢谢看到这里","lines":["把内容换成你的主题，就是一份新的演示。"]}]};
var root = document.documentElement, W = 1280, H = 720, GAP = 32;
var pad = function(n){ return String(n).padStart(2, '0'); };
document.title = DATA.brand;
document.getElementById('frame').style.setProperty('--accent', DATA.accent);
document.getElementById('brandText').textContent = DATA.brand;
document.getElementById('subText').textContent = DATA.subtitle;
document.getElementById('sign').textContent = DATA.footer;
var stage = document.getElementById('stage'), nav = document.getElementById('nav');
var slides = [], navBtns = [], active = 0;
DATA.slides.forEach(function(s, i){
  var sec = document.createElement('section');
  sec.className = 'slide';
  var inner = document.createElement('div');
  inner.className = 'inner';
  var n = 0;
  if (s.kicker) {
    var k = document.createElement('p');
    k.className = 'kicker animate';
    k.style.setProperty('--i', n++);
    k.textContent = s.kicker;
    inner.appendChild(k);
  }
  var h = document.createElement('h2');
  h.className = 'animate';
  h.style.setProperty('--i', n++);
  h.textContent = s.title;
  inner.appendChild(h);
  (s.lines || []).forEach(function(line){
    if (!line.trim()) return;
    var p = document.createElement('p');
    p.className = 'body animate';
    p.style.setProperty('--i', n++);
    p.textContent = line;
    inner.appendChild(p);
  });
  sec.appendChild(inner);
  stage.insertBefore(sec, stage.firstChild);
  var btn = document.createElement('button');
  btn.type = 'button';
  btn.textContent = pad(i + 1) + '  ' + (s.nav || s.title);
  btn.addEventListener('click', function(){ show(i); });
  nav.appendChild(btn);
  slides.push(sec);
  navBtns.push(btn);
});
document.getElementById('total').textContent = pad(slides.length);
function fit(){
  if (window.matchMedia('(max-width: 980px)').matches) { root.style.setProperty('--scale', 1); return; }
  var s = Math.min(1, (window.innerWidth - GAP) / W, (window.innerHeight - GAP) / H);
  root.style.setProperty('--scale', s);
}
function show(i){
  active = Math.max(0, Math.min(i, slides.length - 1));
  slides.forEach(function(s, n){
    s.classList.toggle('active', n === active);
    if (n === active) {
      s.querySelectorAll('.animate').forEach(function(el){
        el.style.animation = 'none'; void el.offsetWidth; el.style.animation = '';
      });
    }
  });
  navBtns.forEach(function(b, n){ b.classList.toggle('active', n === active); });
  document.getElementById('cur').textContent = pad(active + 1);
  document.getElementById('bar').style.width = ((active + 1) / slides.length * 100) + '%';
}
var next = function(){ show(active + 1); }, prev = function(){ show(active - 1); };
document.getElementById('next').addEventListener('click', next);
document.getElementById('prev').addEventListener('click', prev);
window.addEventListener('keydown', function(e){
  if (['ArrowRight','PageDown',' '].indexOf(e.key) > -1) { e.preventDefault(); next(); }
  if (['ArrowLeft','PageUp'].indexOf(e.key) > -1) { e.preventDefault(); prev(); }
  if (e.key === 'Home') show(0);
  if (e.key === 'End') show(slides.length - 1);
});
window.addEventListener('message', function(e){
  if (typeof e.data === 'number') show(e.data);
});
window.addEventListener('resize', fit);
var q = parseInt(new URLSearchParams(window.location.search).get('slide') || '1', 10);
fit();
show(Number.isFinite(q) ? q - 1 : 0);
</script>
</body>
</html>
